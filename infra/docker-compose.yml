services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: projeto_caged_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plataforma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plataforma"]
      interval: 10s
      timeout: 5s
      retries: 5

  tegola:
    build:
      context: ../services/tileserver
      dockerfile: Dockerfile
    container_name: projeto_caged_tegola
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: plataforma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data: